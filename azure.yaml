  template: apex-aca@1.0.0

services:
  api:
    project: ./src/api
    language: ts
    host: containerapp
    docker:
      path: Dockerfile
      context: .
      remoteBuild: true
  web:
    project: ./src/web
    language: docker
    host: containerapp
    docker:
      path: Dockerfile
      context: .
      remoteBuild: true
