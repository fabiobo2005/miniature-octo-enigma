<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7BC4A4">
<title>APEX · Treinos</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/app.css">
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(console.warn));}</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="topRow">
      <a class="iconBtn" href="/" title="Início" aria-label="Início">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <div class="greet">
        <p class="hi" id="greet">Bom dia</p>
        <p class="nm"><span id="userChip">—</span> · Treinos <span class="areaBadge">💪 Área</span></p>
      </div>
      <button class="iconBtn" onclick="logoutUser()" title="Trocar usuário" aria-label="Trocar usuário">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
      </button>
      <button class="iconBtn" onclick="toggleTheme()" title="Tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>

  <div class="hero hero-treinos">
    <div class="heroHead">
      <p class="lbl">Esta semana</p>
      <span class="heroDelta" id="heroDelta" hidden></span>
    </div>
    <div class="big"><span id="wkSessions">0</span><small> treinos</small></div>
    <div class="heroChartBox"><canvas id="chWk"></canvas></div>
    <div class="heroMetrics" id="heroMetrics"></div>
    <div class="row">
      <div class="stat"><b id="wkMinutes">0</b><span>minutos</span></div>
      <div class="stat"><b id="wkLast">—</b><span>último</span></div>
    </div>
  </div>

  <div class="card">
    <h2>🆕 Registrar treino</h2>
    <div class="row2">
      <div class="field"><label>Data</label><input type="date" id="wkDate"></div>
      <div class="field"><label>Duração (min)</label><input type="number" id="wkDuration" inputmode="numeric" step="1" placeholder="60"></div>
    </div>
    <div class="field"><label>Nome</label><input type="text" id="wkName" placeholder="Ex: Push A · Peito e ombro"></div>
    <div class="field"><label>Categoria</label>
      <div class="catChips" id="catChipsForm"></div>
    </div>
    <div class="field"><label>Intensidade</label>
      <div class="intChips" id="intChipsForm">
        <button type="button" class="intChip" data-v="leve">Leve</button>
        <button type="button" class="intChip" data-v="moderado">Moderado</button>
        <button type="button" class="intChip" data-v="forte">Forte</button>
        <button type="button" class="intChip" data-v="maximo">Máximo</button>
      </div>
    </div>
    <input type="hidden" id="wkCategory">
    <input type="hidden" id="wkIntensity">
    <div class="field"><label>Notas (opcional)</label><textarea id="wkNotes" rows="2" placeholder="Cargas, RPE, sensação..."></textarea></div>
    <button class="btn full" onclick="addWorkout()">Registrar treino</button>
  </div>

  <div class="card">
    <h2>📜 Histórico <span class="sub" id="wkHistCount">0 treinos · 60d</span></h2>
    <div class="catChips" id="catFilter"></div>
    <div id="wkList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="/js/core.js"></script>
<script src="/js/treinos.js"></script>
</body>
</html>
