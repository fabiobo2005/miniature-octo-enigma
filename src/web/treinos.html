<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7BC4A4">
<title>APEX · Treinos</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/app.css">
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(console.warn));}</script>
<style>
  .pageTitle{padding:8px 2px 14px}.pageTitle h1{margin:0;font-size:30px;letter-spacing:-.7px;line-height:1.1}.pageTitle p{margin:6px 0 0;color:var(--mut);font-size:14px}
  .programHero{background:var(--grad-soft);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}
  .programHero:before{content:"";position:absolute;right:-42px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(123,196,164,.34),transparent 70%)}
  .heroContent{position:relative}.heroTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.programHero h2{margin:0 0 6px;font-size:22px;letter-spacing:-.4px}.programMeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:13px}.programActions{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.subtleLink{border:0;background:transparent;color:var(--pri-d);font-weight:700;cursor:pointer;padding:4px 0;text-decoration:none;font-size:13px}.coachLine{margin-top:12px;color:var(--mut);font-size:13px}.coachLine b{color:var(--txt)}
  .nivelTag{padding:3px 9px;border-radius:99px;font-weight:800;text-transform:uppercase;letter-spacing:.45px;font-size:11px;white-space:nowrap}.nivelTag.iniciante{background:#e7f7ed;color:#1b6e3a;border:1px solid #b6e3c4}.nivelTag.intermediario{background:#fff5d6;color:#7a5500;border:1px solid #f1d77a}.nivelTag.avancado{background:#fde0e0;color:#8c1a1a;border:1px solid #f3a8a8}body[data-theme="dark"] .nivelTag.iniciante{background:#0c2e1d;color:#7bd9a4;border-color:#1e5a3b}body[data-theme="dark"] .nivelTag.intermediario{background:#3a2e0a;color:#e9c364;border-color:#6b541c}body[data-theme="dark"] .nivelTag.avancado{background:#3a1010;color:#ee8a8a;border-color:#6f2222}
  .progressTrack{height:10px;border-radius:99px;background:rgba(255,255,255,.65);border:1px solid var(--line);overflow:hidden;margin-top:14px}.progressFill{height:100%;width:0;background:var(--grad);border-radius:inherit;transition:width .25s ease}
  .nextCard{display:block;background:linear-gradient(135deg,#d04848,#e58a2f);color:#fff;border:0;border-radius:24px;padding:22px;text-decoration:none;box-shadow:0 10px 28px rgba(208,72,72,.22);margin-bottom:14px;transition:.16s}.nextCard:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(208,72,72,.28)}.nextCard .lbl{margin:0;text-transform:uppercase;letter-spacing:1px;font-size:12px;font-weight:800;opacity:.86}.nextCard h2{margin:4px 0 8px;font-size:24px;letter-spacing:-.5px}.nextCard .desc{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nextCard.disabled{background:var(--surf2);color:var(--mut);box-shadow:none;pointer-events:none}
  .colorDot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.18)}.sessionList{display:flex;flex-direction:column;gap:8px}.sessionRow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px;background:var(--surf2);border:1px solid transparent;border-radius:14px;color:var(--txt);text-decoration:none;transition:.15s}.sessionRow:hover{border-color:var(--pri);background:var(--surf)}.sessionTitle{font-weight:800;font-size:14px;display:block}.sessionMeta{color:var(--mut);font-size:12px;display:block}.statusTag{font-size:10px;text-transform:uppercase;letter-spacing:.45px;font-weight:800;border-radius:99px;padding:3px 7px;background:var(--surf);color:var(--mut);border:1px solid var(--line)}.statusTag.finished,.statusTag.concluido{color:var(--pri-d);background:var(--pri-bg);border-color:var(--pri)}
  details.history{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:0;margin-bottom:14px;box-shadow:var(--shadow)}details.history>summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:800;display:flex;justify-content:space-between;gap:10px}details.history>summary::-webkit-details-marker{display:none}details.history>summary:after{content:"›";font-size:24px;color:var(--mut);transition:.2s;line-height:1}details.history[open]>summary:after{transform:rotate(90deg)}.weekGroup{border-top:1px solid var(--line);padding:12px 18px}.weekGroup h3{margin:0 0 8px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .empty{padding:22px;text-align:center;color:var(--mut);background:var(--surf2);border-radius:14px}.empty .em{font-size:28px;margin-bottom:6px}.banner{background:var(--grad-soft);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}.banner h2{margin:0 0 6px;font-size:21px}.banner p{margin:0;color:var(--mut)}
  .filterBar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.filterChip{padding:7px 12px;border:1px solid var(--line);background:var(--surf);border-radius:99px;cursor:pointer;font-size:12px;font-weight:800;color:var(--mut)}.filterChip.on{background:var(--pri);border-color:var(--pri);color:#fff}.progGrid{display:grid;grid-template-columns:1fr;gap:12px}.progCard{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-l);display:flex;flex-direction:column;gap:10px}.progCard h3{margin:0;font-size:17px;letter-spacing:-.2px}.progCard p{margin:0;color:var(--mut);font-size:13px}.progCard .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.progCard .meta span:not(.nivelTag){font-size:12px;color:var(--mut)}
  .suggestGrid{display:grid;grid-template-columns:1fr;gap:12px}.doneHero{background:linear-gradient(135deg,rgba(95,181,148,.22),rgba(111,168,214,.2));border:1px solid var(--line);border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:var(--shadow)}.doneHero h2{margin:0 0 8px;font-size:23px}.doneHero p{margin:0;color:var(--mut)}
  .loading{padding:34px;text-align:center;color:var(--mut)}.errorBox{border-color:var(--err);background:rgba(217,107,122,.09);color:var(--err)}
  @media(min-width:700px){.progGrid,.suggestGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.programHero h2{font-size:26px}.nextCard h2{font-size:28px}.pageTitle h1{font-size:34px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topRow">
      <a class="iconBtn" href="/" title="Início" aria-label="Início">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <div class="greet">
        <p class="hi" id="greet">Bom dia</p>
        <p class="nm"><span id="userChip">—</span> · Treinos <span class="areaBadge">💪 Área</span></p>
      </div>
      <button class="iconBtn" onclick="logoutUser()" title="Trocar usuário" aria-label="Trocar usuário">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
      </button>
      <button class="iconBtn" onclick="toggleTheme()" title="Tema" aria-label="Tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>

  <div class="pageTitle">
    <h1>Treinos</h1>
    <p id="pageSubtitle">Seu programa, próximo treino e histórico em um só lugar.</p>
  </div>

  <main id="treinosApp"><div class="loading">Carregando treinos…</div></main>
</div>
<div class="toast" id="toast"></div>
<script src="/js/core.js"></script>
<script src="/js/treinos.js"></script>
</body>
</html>
