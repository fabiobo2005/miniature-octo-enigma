name: Deploy · Dev (auto on push to main)

on:
  push:
    branches: [main]
    paths:
      - 'src/api/**'
      - 'src/web/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  RG: rg-apex-dev
  ACR: acrapexydcoajutfl3he
  ACA_API: ca-apex-api
  ACA_WEB: ca-apex-web

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compute tag
        id: tag
        run: echo "tag=dev-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: ACR build · api
        run: |
          az acr build --registry "$ACR" \
            --image "apex-api:${{ steps.tag.outputs.tag }}" \
            --file src/api/Dockerfile \
            src/api

      - name: ACR build · web
        run: |
          az acr build --registry "$ACR" \
            --image "apex-web:${{ steps.tag.outputs.tag }}" \
            --file src/web/Dockerfile \
            src/web

      - name: Deploy api dev revision
        id: dep_api
        run: |
          SUFFIX="${{ steps.tag.outputs.tag }}"
          az containerapp update -g "$RG" -n "$ACA_API" \
            --image "$ACR.azurecr.io/apex-api:$SUFFIX" \
            --revision-suffix "$SUFFIX" \
            --query "properties.latestRevisionName" -o tsv > /tmp/api_rev
          REV=$(cat /tmp/api_rev)
          echo "rev=$REV" >> $GITHUB_OUTPUT
          echo "Latest api rev: $REV"

      - name: Deploy web dev revision
        id: dep_web
        run: |
          SUFFIX="${{ steps.tag.outputs.tag }}"
          az containerapp update -g "$RG" -n "$ACA_WEB" \
            --image "$ACR.azurecr.io/apex-web:$SUFFIX" \
            --revision-suffix "$SUFFIX" \
            --query "properties.latestRevisionName" -o tsv > /tmp/web_rev
          REV=$(cat /tmp/web_rev)
          echo "rev=$REV" >> $GITHUB_OUTPUT
          echo "Latest web rev: $REV"

      - name: Reaffirm prod traffic 100% (defensive)
        run: |
          # Latest revision is the new dev one; ensure traffic still goes to prod label only.
          az containerapp ingress traffic set -g "$RG" -n "$ACA_API" --label-weight "prod=100" -o table
          az containerapp ingress traffic set -g "$RG" -n "$ACA_WEB" --label-weight "prod=100" -o table

      - name: Label new revisions as dev
        run: |
          # Remove any stale 'dev' label first (idempotent).
          az containerapp revision label remove -g "$RG" -n "$ACA_API" --label dev --no-prompt -o none || true
          az containerapp revision label remove -g "$RG" -n "$ACA_WEB" --label dev --no-prompt -o none || true
          az containerapp revision label add -g "$RG" -n "$ACA_API" --label dev --revision "${{ steps.dep_api.outputs.rev }}" --no-prompt -o table
          az containerapp revision label add -g "$RG" -n "$ACA_WEB" --label dev --revision "${{ steps.dep_web.outputs.rev }}" --no-prompt -o table

      - name: Summary
        run: |
          ENV_DOMAIN=$(az containerapp env show -g "$RG" -n $(az containerapp show -g "$RG" -n "$ACA_WEB" --query "properties.managedEnvironmentId" -o tsv | awk -F/ '{print $NF}') --query "properties.defaultDomain" -o tsv)
          {
            echo "### Dev deploy — ${{ steps.tag.outputs.tag }}"
            echo ""
            echo "| App | Revision | URL |"
            echo "|---|---|---|"
            echo "| api (internal) | ${{ steps.dep_api.outputs.rev }} | https://${ACA_API}--dev.internal.${ENV_DOMAIN} |"
            echo "| web (public)   | ${{ steps.dep_web.outputs.rev }} | https://${ACA_WEB}--dev.${ENV_DOMAIN} |"
            echo ""
            echo "**Tráfego público continua 100% prod.** Use o URL com \`--dev\` para validar."
            echo ""
            echo "Para promover: rode o workflow [Promote · Prod](../../actions/workflows/promote-prod.yml)."
          } >> $GITHUB_STEP_SUMMARY
